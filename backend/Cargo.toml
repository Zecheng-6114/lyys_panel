[package]
name = "lyys-panel"
version = "1.4.0"
edition = "2021"
description = "服务器运维面板后端"

[[bin]]
name = "lyys-panel"
path = "src/main.rs"

[dependencies]
# 4.3 容器日志流：axum 的 ws feature（WebSocket 升级）
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
rust-embed = "8"
mime_guess = "2"
anyhow = "1"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 1.3 HTTPS：rustls TLS 终结 + 首启自签证书生成（纯 Rust，无 OpenSSL 依赖）
# 注意：必须用 tls-rustls-no-provider。默认 tls-rustls 强推 rustls/aws-lc-rs，
# 而 reqwest 的 rustls-tls 走 ring；同进程出现两个 crypto provider 会让 rustls
# 在握手时 panic（Could not automatically determine the CryptoProvider）。
# no-provider 变体不绑定任何 provider，全树只剩 reqwest 拉进来的 ring，
# rustls 自动选择唯一 provider，无需手动 install_default。
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
# 3.2 自更新 / 3.3 告警：出站 HTTPS（GitHub API 与 webhook），复用 rustls 栈
# stream feature（4.5 群聊）：流式响应的 bytes_stream 按块读取
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# AI 助手：把上游 chat/completions 的 SSE 字节流接入 axum Body::from_stream
tokio-stream = "0.1"
# 4.5 AI 群聊：reqwest 流式响应按块读取（bytes_stream）+ WS socket 拆分
futures-util = "0.3"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
