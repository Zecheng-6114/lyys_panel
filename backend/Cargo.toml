[package]
name = "lyys-panel"
version = "0.1.0"
edition = "2021"
description = "服务器运维面板后端"

[[bin]]
name = "lyys-panel"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
rust-embed = "8"
mime_guess = "2"
anyhow = "1"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---------- AI 助手功能暂时停用（用户决定 2026-09-24）----------
# 以下依赖仅被已注释的 ai/aimemory/aitools/emotion/websearch 模块使用。
# 停用期间从编译中移除以显著缩减二进制与依赖树；恢复 AI 时，需连同
# main.rs 里的模块注释一起放开下面 5 行。
# ureq = { version = "2", default-features = false, features = ["tls"] }        # AI 调模型服务的同步 HTTP 客户端
# ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }  # 情绪识别 ONNX 运行时
# regex = "1"                                                                    # 仅 websearch 用
# tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }   # AI 分词
# tokio-stream = "0.1"                                                           # AI SSE 流式响应

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
