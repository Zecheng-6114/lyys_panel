# CI：PR 触发 clippy + test + build。
#
# 顺序铁律：后端用 rust-embed 在编译期读取 frontend/dist，任何会编译后端的
# 步骤（clippy/test/build）之前必须先完成前端构建，否则 rust-embed 直接报错。
# 本仓库后端无 openssl-sys / aws-lc-sys 等系统依赖（rusqlite bundled 只需
# cc，TLS 走纯 Rust rustls），GitHub 托管 runner 开箱即可编译。
name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # backend/rust-toolchain.toml 钉住 stable 并要求 rustfmt/clippy，
      # rustup 会自动尊重该文件
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # rust-embed 编译期读取 frontend/dist，必须先于一切后端编译步骤
      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: backend
        run: cargo test

      - name: Build (release)
        working-directory: backend
        run: cargo build --release
